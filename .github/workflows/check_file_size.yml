# Check File Size
#
# 仅在 PR 为图片提交时检查变更图片是否均 <= 1 MiB
#
# 检查 pr-type (PR body 中的 <!-- pr-type: xxx -->):
#   - images (或缺省无标签) -> 执行检查
#   - ci_wf / docs / others  -> 跳过, 不 fail
# 无变更图片时跳过, 不 fail (无图提醒交给 check_pr_content)
#
# 脚本内重要常量:
#   MAX_SIZE         1024 * 1024 (1 MiB)
#   IMAGE_EXT        认定的图片后缀; 只对这些文件查大小
#   ACTIVE_STATUSES  只检查 added / modified / renamed / copied
#   PR_TYPE_RE       解析 pr-type 标签
#
name: Check File Size

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  check-size:
    runs-on: ubuntu-latest
    steps:
      - name: Check file sizes
        uses: actions/github-script@v7
        with:
          script: |
            const MAX_SIZE = 1024 * 1024; // 1 MiB
            const IMAGE_EXT = /\.(jpe?g|jfif|png|webp|tiff?|hei[cf]|avif|gif|bmp)$/i;
            const ACTIVE_STATUSES = new Set(['added', 'modified', 'renamed', 'copied']);
            const PR_TYPE_RE = /<!--\s*pr-type:\s*(\S+)\s*-->/;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setFailed('Missing pull_request payload.');
              return;
            }

            const prNumber = pr.number;
            const typeMatch = (pr.body || '').match(PR_TYPE_RE);
            const prType = typeMatch ? typeMatch[1] : 'images';

            if (prType !== 'images') {
              core.info(`pr-type is "${prType}", skip file size check.`);
              return;
            }

            let files = [];
            let page = 1;
            while (true) {
              const compare = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: `${pr.base.sha}...${pr.head.sha}`,
                per_page: 100,
                page,
              });

              const pageFiles = compare.data.files || [];
              if (pageFiles.length === 0) break;

              files.push(...pageFiles);
              if (pageFiles.length < 100) break;
              page++;
            }

            const images = files.filter(file =>
              ACTIVE_STATUSES.has(file.status) && IMAGE_EXT.test(file.filename)
            );
            if (images.length === 0) {
              core.info('No changed images found, skip file size check.');
              return;
            }

            const oversized = [];
            for (const file of images) {
              try {
                const encodedPath = file.filename
                  .replace(/%/g, '%25')
                  .replace(/#/g, '%23')
                  .replace(/\?/g, '%3F');

                const content = await github.rest.repos.getContent({
                  owner: pr.head.repo.owner.login,
                  repo: pr.head.repo.name,
                  path: encodedPath,
                  ref: pr.head.sha,
                });

                const size = content.data.size;
                if (size > MAX_SIZE) {
                  oversized.push(`- ${file.filename} (${size} bytes)`);
                }
              } catch (error) {
                core.warning(`Skip file ${file.filename}: ${error.message}`);
              }
            }

            if (oversized.length > 0) {
              const body = [
                '我们注意到以下文件的大小超过了 1 MiB, 请在压缩后再次提交 Pull Request:',
                'We have noted that the following files exceed 1 MiB in size. Please resubmit your pull request after compressing them:',
                '',
                ...oversized,
                '',
                '---',
                '',
                '温馨提示: 您可以直接使用 `/auto-fix` 命令来自动修复这些文件。',
                'Warm reminder: You can use the `/auto-fix` command to automatically fix these files.',
                '',
                '该命令会将图片压缩到 1 MiB 内, 并且去除**所有的 EXIF**信息, 若您不希望文件被改动, 请自行处理后重新提交 PR',
                'This command will compress images to under 1 MiB and strip all EXIF metadata.',
                'If you do not want your files modified, please fix them yourself and push again.',
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });

              core.setFailed('File size check failed');
            } else {
              core.info('All changed images are under 1 MiB.');
            }
